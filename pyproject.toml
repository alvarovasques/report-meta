[project]
name = "report-meta"
version = "0.1.0"
description = "Coletor e gerador de relatórios de performance Meta (Instagram, Facebook, Meta Ads) - Internet Mais"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "tenacity>=9.0",
  "typer>=0.12",
  "structlog>=24.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.32", "ruff>=0.6"]

[project.scripts]
report-meta = "collector.cli:app"

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["collector", "web"]
include-package-data = true

[tool.setuptools.package-data]
web = ["templates/*.html"]
collector = ["sql/*.sql"]
